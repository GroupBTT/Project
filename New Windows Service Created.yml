title: New Windows Service Created
id: 8c3e21a4-9b12-4d87-93ef-123456789abc
status: experimental
description: Detects the creation of a new Windows service via System Event ID 7045 or the presence of specific test service strings, often used for persistence or lateral movement.
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: SOC Team
date: 2026/10/26
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1543.003
logsource:
    product: windows
    service: system
detection:
    selection:
        EventCode: 7045
    selection_string:
        CommandLine|contains: 'TestService'
    condition: selection or selection_string
falsepositives:
    - Legitimate administrative software installation or system service deployments.
level: medium