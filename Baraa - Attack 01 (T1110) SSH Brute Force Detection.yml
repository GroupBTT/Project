title: SSH Brute Force / Multiple Failed SSH Logins
id: a1b2c3d4-e5f6-7890-1234-56789abcdef1
status: experimental
description: Detects multiple failed SSH authentication attempts on Linux systems via auditd logs.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Baraa Alshoqran
date: 2026/10/23
logsource:
    category: process_creation
    product: linux
    service: auditd
detection:
    selection:
        type: 'USER_LOGIN'
        res: 'failed'
    condition: selection | count() by addr > 3
falsepositives:
    - User entering wrong password multiple times accidentally
level: high
tags:
    - attack.credential_access
    - attack.t1110